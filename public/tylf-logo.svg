<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none" role="img" aria-label="Thank You Life Fest 2026 — We Are One Magic Forest Kid Scout Bee Badge">
  <defs>
    <linearGradient id="forestSky" x1="60" y1="8" x2="60" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#153225" />
      <stop offset="55%" stop-color="#204937" />
      <stop offset="100%" stop-color="#2A5E46" />
    </linearGradient>
    <radialGradient id="heartGlow" cx="60" cy="58" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBE09C" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#153225" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sunRise" x1="60" y1="42" x2="60" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE16D" />
      <stop offset="100%" stop-color="#F39C18" />
    </linearGradient>
    <clipPath id="badgeInnerClip">
      <circle cx="60" cy="60" r="50.5" />
    </clipPath>
  </defs>

  <!-- Outer Kid Scout Patch Rim -->
  <circle cx="60" cy="60" r="58" fill="#183528" />
  <circle cx="60" cy="60" r="56.2" stroke="#E89F3C" stroke-width="3" />

  <!-- Enchanted Woodland & Forest Pines Backdrop -->
  <g clip-path="url(#badgeInnerClip)">
    <rect x="8" y="8" width="104" height="104" fill="url(#forestSky)" />
    <circle cx="60" cy="58" r="44" fill="url(#heartGlow)" />

    <!-- Left Magical Forest Evergreens -->
    <path d="M18 46 L26 61 L10 61 Z" fill="#3C825B" />
    <path d="M18 56 L29 76 L7 76 Z" fill="#2D6748" />
    <path d="M26 67 L35 86 L17 86 Z" fill="#469066" />

    <!-- Right Magical Forest Evergreens -->
    <path d="M102 46 L110 61 L94 61 Z" fill="#3C825B" />
    <path d="M102 56 L113 76 L91 76 Z" fill="#2D6748" />
    <path d="M94 67 L103 86 L85 86 Z" fill="#469066" />

    <!-- Rolling Meadow Horizon -->
    <path d="M6 85 Q60 96 114 85 L114 114 L6 114 Z" fill="#285B40" />
    <path d="M6 94 Q60 86 114 94 L114 114 L6 114 Z" fill="#357553" />
  </g>

  <!-- Kid Scout Stitched Merit Ring -->
  <circle
    cx="60"
    cy="60"
    r="51.5"
    stroke="#FBE09C"
    stroke-opacity="0.78"
    stroke-width="1.5"
    stroke-dasharray="4.8 3.5"
    stroke-linecap="round"
  />

  <!-- Magical Forest North Star & Fireflies -->
  <path d="M60 14.5 L61.7 19 L66.2 20.7 L61.7 22.4 L60 26.9 L58.3 22.4 L53.8 20.7 L58.3 19 Z" fill="#FAF7F0" />
  <path d="M22 25.5 L23 28.2 L25.7 29.2 L23 30.2 L22 32.9 L21 30.2 L18.3 29.2 L21 28.2 Z" fill="#FBE09C" />
  <circle cx="15" cy="40" r="1.6" fill="#FBE09C" />
  <circle cx="103" cy="79" r="1.8" fill="#FBE09C" />
  <circle cx="17" cy="79" r="1.8" fill="#FBE09C" />

  <!-- Luminous Ivory Heart Sanctuary -->
  <path
    d="M60 39.5 C54 28 36.5 25 28 36.5 C20 47.5 24 65.5 39.5 77.5 L60 92 L80.5 77.5 C96 65.5 100 47.5 92 36.5 C83.5 25 66 28 60 39.5 Z"
    fill="#FAF7F0"
  />

  <!-- Two-Tone Heart Frame: Lush Green Leaf Vine (Left) + Radiant Gold Embrace (Right) -->
  <path
    d="M60 39.5 C54 28 36.5 25 28 36.5 C20 47.5 24 65.5 39.5 77.5 L60 92"
    stroke="#6FB52B"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M60 39.5 C66 28 83.5 25 92 36.5 C100 47.5 96 65.5 80.5 77.5 L60 92"
    stroke="#F4B41A"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Left Vine Leaves & Bottom Twin Sprout Leaves -->
  <path d="M26.5 38.5 C19 35 16 28.5 21.5 25 C27 26 29 32.5 26.5 38.5 Z" fill="#7CC230" />
  <path d="M33 31.5 C28 26 28.5 20 34 19 C38.5 22 37.5 27.5 33 31.5 Z" fill="#63A524" />
  <path d="M60 92 C53.5 90.5 47 93.5 46.5 99.5 C52 101 57.5 98 60 92 Z" fill="#7CC230" />
  <path d="M60 92 C66.5 90.5 73 93.5 73.5 99.5 C68 101 62.5 98 60 92 Z" fill="#63A524" />

  <!-- Rising Sun & Golden Sunbeams -->
  <path d="M46.5 56 A13.5 13.5 0 0 1 73.5 56 Z" fill="url(#sunRise)" />
  <line x1="60" y1="39.5" x2="60" y2="34.8" stroke="#F4B41A" stroke-width="2.5" stroke-linecap="round" />
  <line x1="51.8" y1="41.8" x2="49.2" y2="37.8" stroke="#F4B41A" stroke-width="2.4" stroke-linecap="round" />
  <line x1="68.2" y1="41.8" x2="70.8" y2="37.8" stroke="#F4B41A" stroke-width="2.4" stroke-linecap="round" />
  <line x1="45.2" y1="47.2" x2="41.5" y2="44.8" stroke="#F4B41A" stroke-width="2.3" stroke-linecap="round" />
  <line x1="74.8" y1="47.2" x2="78.5" y2="44.8" stroke="#F4B41A" stroke-width="2.3" stroke-linecap="round" />

  <!-- Joyful "We Are One" Community Figures -->
  <!-- Orange figure -->
  <circle cx="40.5" cy="56" r="3" fill="#F2841D" />
  <path d="M33.5 56.5 L40.5 60.5 L46.5 57 L43.5 68.5 L37.5 68.5 Z" fill="#F2841D" />
  <!-- Gold child -->
  <circle cx="50.2" cy="59.8" r="2.5" fill="#F5BA1E" />
  <path d="M45.2 60.2 L50.2 63.2 L55.2 60.2 L52.5 69.5 L47.9 69.5 Z" fill="#F5BA1E" />
  <!-- Green center child -->
  <circle cx="60" cy="60.8" r="2.6" fill="#70B32B" />
  <path d="M54.6 61.2 L60 64.2 L65.4 61.2 L62.5 70.5 L57.5 70.5 Z" fill="#70B32B" />
  <!-- Coral child -->
  <circle cx="69.8" cy="59.8" r="2.5" fill="#EE7E73" />
  <path d="M64.8 60.2 L69.8 63.2 L74.8 60.2 L72.1 69.5 L67.5 69.5 Z" fill="#EE7E73" />
  <!-- Violet figure -->
  <circle cx="79.5" cy="56" r="3" fill="#9A74C4" />
  <path d="M73.5 57 L79.5 60.5 L86.5 56.5 L82.5 68.5 L76.5 68.5 Z" fill="#9A74C4" />

  <!-- Golden "WE ARE ONE" Scout Banner Ribbon -->
  <path
    d="M39.5 72.5 Q60 77.5 80.5 72.5 L77 81.5 Q60 86 43 81.5 Z"
    fill="#F9CA3A"
    stroke="#E09419"
    stroke-width="1"
    stroke-linejoin="round"
  />
  <text
    x="60"
    y="80.2"
    text-anchor="middle"
    fill="#183528"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="5.6"
    font-weight="800"
    letter-spacing="0.45"
  >
    WE ARE ONE
  </text>

  <!-- Soaring Golden Bee Hero (Bridging the Forest & Heart) -->
  <path
    d="M93.5 41.5 C98 48 97 56 91.5 61.5"
    stroke="#F5B422"
    stroke-width="1.6"
    stroke-dasharray="2.4 2.4"
    stroke-linecap="round"
  />
  <g transform="translate(88, 31) rotate(-22)">
    <!-- Wings -->
    <ellipse cx="-1.5" cy="-6.5" rx="4.2" ry="6.2" transform="rotate(-18 -1.5 -6.5)" fill="#FAF7F0" stroke="#183528" stroke-width="0.9" />
    <ellipse cx="4" cy="-6" rx="3.8" ry="5.6" transform="rotate(14 4 -6)" fill="#FBE09C" stroke="#183528" stroke-width="0.9" />
    <!-- Antennae -->
    <path d="M-7.5 -2.5 C-10 -5.5 -11.5 -5.5 -12.5 -4.5" stroke="#FBE09C" stroke-width="1.5" stroke-linecap="round" />
    <path d="M-6 -3.5 C-7.5 -7 -9 -7.5 -10.5 -6.5" stroke="#FBE09C" stroke-width="1.5" stroke-linecap="round" />
    <!-- Body -->
    <ellipse cx="1.5" cy="0.5" rx="7.8" ry="5.6" fill="#F9CE52" stroke="#183528" stroke-width="1" />
    <path d="M0 -4.8 L0 5.8" stroke="#183528" stroke-width="2.1" />
    <path d="M4.2 -4.2 L4.2 5.2" stroke="#183528" stroke-width="2" />
    <!-- Head -->
    <circle cx="-5.5" cy="0" r="4.2" fill="#FDE16D" stroke="#183528" stroke-width="1.1" />
  </g>
</svg>
